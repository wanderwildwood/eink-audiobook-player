name: Release

on:
  push:
    tags:
      - 'v*'
  # Also startable by hand. A tag push can take a long time to produce a run - on 2026-08-26 the
  # other three forks' releases took 15 to 25 minutes to appear, long enough to look like the push
  # had done nothing - and this gives a way to start a release without deleting and re-pushing a
  # tag, or to retry one that failed halfway.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup

      # Without these the build falls back to the debug keystore checked into the repo, and the
      # release goes out signed with a key anybody has. Fail loudly instead of shipping that.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build APK
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleFreeRelease \
            -Paudiobook.versionName="$version_name" \
            -Paudiobook.versionCode="$GITHUB_RUN_NUMBER"

      # A release signed with the wrong key cannot be taken back once people have installed it.
      - name: Verify the APK is not debug signed
        run: |
          apk=app/build/outputs/apk/free/release/app-free-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with
      # in their downloads folder and what a checksum quoted anywhere refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/eink-audiobook-player.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          apk_name="eink-audiobook-player-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/free/release/app-free-release.apk "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_name" eink-audiobook-player.apk
          sha256sum eink-audiobook-player.apk > eink-audiobook-player.apk.sha256

      # The generated notes are a list of commits; they cannot say what someone has to do
      # before installing. This goes above them, and can be emptied once nobody is still
      # upgrading from a build signed with the old key.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # The wildcard does not match the unversioned pair, so it is listed too.
          files: |
            eink-audiobook-player-*.apk
            eink-audiobook-player-*.apk.sha256
            eink-audiobook-player.apk
            eink-audiobook-player.apk.sha256
          body_path: .github/release-body.md
          generate_release_notes: true
